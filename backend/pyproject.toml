[project]
name = "bidsight-backend"
version = "0.1.0"
description = "FastAPI backend for the BidSight procurement evaluation MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlmodel>=0.0.22,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "pymupdf>=1.24,<2.0",
    "openai>=1.42,<3.0",
    "pytest>=8.0,<10.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.fastapi]
entrypoint = "app.main:app"